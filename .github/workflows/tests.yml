# The compatibility matrix this package publicly claims, proven on every push.
#
# Nothing here touches a network, a chain or a wallet: the suite runs against an injected fake
# transport. The one live call is a read-only capabilities() in a separate, non-blocking job.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [11, 12, 13]
        dependencies: [lowest, stable]
        exclude:
          - laravel: 13   # Laravel 13 requires PHP 8.3
            php: '8.2'
        include:
          - laravel: 11
            testbench: 9
          - laravel: 12
            testbench: 10
          - laravel: 13
            testbench: 11

    name: L${{ matrix.laravel }} · PHP ${{ matrix.php }} · ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none

      - name: Pin this row of the matrix
        run: |
          composer require --no-update --no-interaction \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/contracts:^${{ matrix.laravel }}.0"
          composer require --no-update --no-interaction --dev \
            "orchestra/testbench:^${{ matrix.testbench }}.0"

      - run: composer validate --strict

      - name: Install
        run: composer update --no-interaction --prefer-dist ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - run: composer lint

      # Static analysis needs one resolved dependency set, not nine; the newest row is enough.
      - name: Static analysis
        if: matrix.laravel == 13 && matrix.php == '8.3' && matrix.dependencies == 'stable'
        run: composer analyse

      - run: composer test

  smoke:
    runs-on: ubuntu-latest
    name: read-only API smoke
    # Never blocks a release: the API being briefly unreachable says nothing about this package.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist

      - name: capabilities() against production
        run: |
          php -r '
            require "vendor/autoload.php";
            $caps = (new P2Flux\P2FluxClient(["apiUrl" => "https://api.p2flux.com", "timeout" => 20]))->capabilities();
            if (($caps["chain_id"] ?? null) !== 8453) { fwrite(STDERR, "unexpected chain\n"); exit(1); }
            echo "chain ", $caps["chain_id"], " ", $caps["tokens"][0]["symbol"], "\n";
          '
